name: Lean formalization

on:
  push:
    paths:
      - 'formal/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve pinned mathlib dependency
        run: ~/.elan/bin/lake update
      - name: Fetch mathlib build cache
        run: ~/.elan/bin/lake exe cache get
      - name: Build formalization
        run: ~/.elan/bin/lake build DirectionalFriction
